<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#0288d1"/>
  <link rel="manifest" href="./manifest.webmanifest"/>
  <title>Speech Game</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh;background:linear-gradient(135deg,#7bd3ff,#5fb8ff,#3a9de8);color:#222;-webkit-tap-highlight-color:transparent;user-select:none}
    .bg{position:fixed;inset:0;background:radial-gradient(circle at 15% 20%,rgba(255,255,255,.4),transparent 40%),radial-gradient(circle at 85% 80%,rgba(255,255,255,.25),transparent 45%);pointer-events:none;z-index:0}
    .app{position:relative;z-index:1;width:min(920px,94%);margin:0 auto;padding:18px 12px 36px;min-height:100vh;display:flex;flex-direction:column}
    .progress-wrapper{display:flex;align-items:center;gap:14px;margin-bottom:16px}
    .progress-bar{flex:1;height:18px;background:rgba(255,255,255,.35);border-radius:50px;overflow:hidden}
    #progressFill{width:0%;height:100%;background:linear-gradient(90deg,#00c853,#69f0ae);border-radius:50px;transition:width .55s ease}
    #progressText{font-weight:700;color:#fff;min-width:52px;text-align:right;text-shadow:0 1px 3px rgba(0,0,0,.25)}
    .score-pill{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.35);padding:4px 12px;border-radius:20px;font-weight:700;color:#fff}
    .card{background:#fff;border-radius:28px;padding:28px 24px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.15);flex:1;display:flex;flex-direction:column;align-items:center}
    .game-title{font-size:1.15rem;font-weight:700;color:#5a6a7a;margin-bottom:6px}
    .question{font-size:1.5rem;font-weight:700;color:#1a1a2e;margin-bottom:16px}
    .image-frame{width:min(220px,70vw);aspect-ratio:1;background:linear-gradient(145deg,#fff,#f4f9ff);border-radius:24px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(0,0,0,.1);margin-bottom:16px}
    .image-frame img{width:100%;height:100%;object-fit:contain}
    .word-display{display:flex;flex-wrap:wrap;justify-content:center;gap:.35rem;min-height:52px;align-items:center;margin-bottom:12px}
    .letter-slot{width:40px;height:48px;border-radius:12px;background:#f0f7ff;border:2px solid #c5daf5;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:800;text-transform:uppercase;color:#1a3a5c}
    .letter-slot.blank{border-style:dashed;color:#90a4ae;background:#f8fbff}
    .letter-slot.revealed{background:linear-gradient(135deg,#43e97b,#38f9d7);border-color:#00c853;color:#083318}
    .letter-slot.visible{background:#fff;border-color:#4fc3f7}
    .mic-btn{width:96px;height:96px;border:none;border-radius:50%;cursor:pointer;font-size:40px;background:linear-gradient(145deg,#4fc3f7,#0288d1);color:#fff;box-shadow:0 12px 28px rgba(2,136,209,.35)}
    .mic-btn.listening{animation:pulse 1.1s ease-in-out infinite;background:linear-gradient(145deg,#ff7043,#e64a19)}
    @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
    .mic-label{font-size:.9rem;color:#7a8a9a;margin-top:8px}
    .heard-box{margin-top:14px;padding:10px 16px;background:#f0f7ff;border-radius:14px;border:1px solid #d0e4ff;width:100%;max-width:360px;font-weight:700;color:#1a3a5c}
    .feedback{min-height:36px;margin-top:12px;font-size:1.2rem;font-weight:700}
    .feedback.success{color:#1b9e4b}.feedback.retry{color:#e53935}.feedback.hint{color:#0288d1;font-size:1rem}
    .secondary-btns{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin-top:12px}
    .sec-btn{padding:.5rem 1rem;border-radius:50px;border:1px solid #cfd8e3;background:#f5f9fc;color:#3a4a5a;font-size:.88rem;font-weight:600;cursor:pointer}
    #typeArea{display:none;width:100%;max-width:320px;margin-top:10px}
    #typeInput{width:100%;padding:.7rem 1rem;border-radius:14px;border:2px solid #c5daf5;font-size:1.1rem;text-align:center;text-transform:uppercase;user-select:text}
    .type-check{margin-top:.5rem;width:100%;padding:.7rem;border:none;border-radius:50px;background:linear-gradient(135deg,#ff6f61,#ff8a65);color:#fff;font-weight:700;cursor:pointer}
    .tile-btn{width:48px;height:52px;border-radius:12px;border:2px solid #4fc3f7;background:#fff;font-size:1.35rem;font-weight:800;color:#1a3a5c;cursor:pointer}
    .status{background:#fff3e0;color:#e65100;padding:.7rem 1rem;border-radius:12px;font-size:.85rem;max-width:360px;margin-top:10px;border:1px solid #ffe0b2;display:none}
    .end-screen{display:none;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center}
    .end-screen.show{display:flex}
    .mainBtn{border:none;background:linear-gradient(135deg,#ff6f61,#ff8a65);color:#fff;padding:16px 48px;border-radius:50px;font-size:1.15rem;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
<div class="bg"></div>
<div class="app">
  <div class="progress-wrapper">
    <div class="progress-bar"><div id="progressFill"></div></div>
    <span id="progressText">1 / 1</span>
    <div class="score-pill">★ <span id="score">0</span></div>
  </div>
  <div class="card" id="gameArea">
    <div class="game-title" id="gameTitle">Speech Game</div>
    <div class="question" id="question">Say the word!</div>
    <div class="image-frame" id="imageFrame"><div style="font-size:3rem;opacity:.4">📷</div></div>
    <div class="word-display" id="wordDisplay"></div>
    <button class="mic-btn" id="micBtn" onclick="toggleListen()">🎤</button>
    <div class="mic-label" id="micLabel">Tap the mic & say the word</div>
    <div class="heard-box">I heard: <span id="heardText">—</span></div>
    <div class="feedback" id="feedback"></div>
    <div class="secondary-btns">
      <button class="sec-btn" onclick="showHint()">💡 Hint</button>
      <button class="sec-btn" onclick="speakWord()">🔊 Hear word</button>
      <button class="sec-btn" onclick="showTypeInput()">⌨️ Type</button>
      <button class="sec-btn" onclick="showTileMode()">🔤 Tiles</button>
    </div>
    <div id="typeArea">
      <input id="typeInput" placeholder="Type the word…"/>
      <button class="type-check" onclick="submitTyped()">Check answer</button>
    </div>
    <div id="tileArea" style="display:none;width:100%;max-width:360px;margin-top:10px">
      <div id="tileBuilt" style="min-height:28px;font-size:1.3rem;font-weight:800;letter-spacing:.15em;margin-bottom:8px">&nbsp;</div>
      <div id="tileTray" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center"></div>
    </div>
    <div class="status" id="status"></div>
  </div>
  <div class="end-screen" id="endScreen">
    <div class="card" style="width:100%">
      <div style="font-size:42px;margin-bottom:12px">⭐⭐⭐⭐⭐</div>
      <h1 style="font-size:2rem;margin-bottom:8px">Mission Complete!</h1>
      <p style="color:#5a6a7a;margin-bottom:12px">You earned <strong id="finalScore">0</strong> stars</p>
      <button class="mainBtn" onclick="restartGame()">PLAY AGAIN</button>
    </div>
  </div>
</div>
<script src="./play-app.js"></script>
</body>
</html>
